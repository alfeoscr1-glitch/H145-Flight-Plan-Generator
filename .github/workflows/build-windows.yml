name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows EXE
        run: >
          dotnet publish H145FlightPlanner.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: H145-Flight-Plan-Generator-Windows
          path: publish/H145FlightPlanner.exe
